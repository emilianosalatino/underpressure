<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#003C52">
<title>Bitácora de Presión</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-pulse" aria-hidden="true">
        <svg viewBox="0 0 100 30" width="34" height="14"><polyline points="0,15 22,15 28,4 34,26 40,15 100,15" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <div>
        <div class="brand-title">Bitácora de Presión</div>
        <div class="brand-sub" id="rangeSub">&nbsp;</div>
      </div>
    </div>
    <div class="header-actions">
      <label class="icon-btn" title="Restaurar respaldo" aria-label="Restaurar respaldo">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9"/><path d="M7 14l5-5 5 5"/><path d="M5 3h14"/></svg>
        <input type="file" id="importInput" accept="application/json" hidden>
      </label>
      <button id="backupBtn" class="icon-btn" title="Guardar respaldo (.json)" aria-label="Guardar respaldo">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M17 10l-5 5-5-5"/><path d="M5 21h14"/></svg>
      </button>
      <button id="exportBtn" class="icon-btn" title="Exportar PDF" aria-label="Exportar PDF">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="view-log" class="view active">
  <section class="chart-card">
    <div class="chart-card-head">
      <h2>Comportamiento</h2>
      <select id="rangeSelect" class="range-select">
        <option value="7">1 semana</option>
        <option value="14">2 semanas</option>
        <option value="30" selected>1 mes</option>
        <option value="custom">Intervalo...</option>
        <option value="all">Todo</option>
      </select>
    </div>
    <div id="customRangeRow" class="datetime-row hidden">
      <label class="field">
        <span>Desde</span>
        <input type="date" id="rangeFrom">
      </label>
      <label class="field">
        <span>Hasta</span>
        <input type="date" id="rangeTo">
      </label>
    </div>
    <div class="chart-wrap"><canvas id="trendChart" height="180"></canvas></div>
    <div class="legend-row">
      <span><i class="dot dot-sys"></i>Sistólica</span>
      <span><i class="dot dot-dia"></i>Diastólica</span>
      <span><i class="dot dot-pulse"></i>Pulso</span>
    </div>
  </section>

  <section class="log-section">
    <div class="log-head">
      <h2>Registros</h2>
      <span id="countBadge" class="count-badge">0</span>
    </div>
    <div id="emptyState" class="empty-state hidden">
      <p>Aún no hay registros.</p>
      <p class="empty-sub">Toca "Registrar" para capturar tu primera lectura.</p>
    </div>
    <ul id="logList" class="log-list"></ul>
  </section>
</main>

<main id="view-add" class="view">
  <section class="capture-card">
    <div class="lcd-panel" id="lcdPanel">
      <div class="lcd-row">
        <div class="lcd-label">SYS<span>mmHg</span></div>
        <div class="lcd-digits" id="digSys">--</div>
      </div>
      <div class="lcd-row">
        <div class="lcd-label">DIA<span>mmHg</span></div>
        <div class="lcd-digits" id="digDia">--</div>
      </div>
      <div class="lcd-row">
        <div class="lcd-label">PULSE<span>/min</span></div>
        <div class="lcd-digits" id="digPulse">--</div>
      </div>
    </div>

    <div class="manual-grid">
      <label class="field">
        <span>Sistólica (SYS)</span>
        <input type="number" id="inputSys" inputmode="numeric" placeholder="—" min="50" max="260">
      </label>
      <label class="field">
        <span>Diastólica (DIA)</span>
        <input type="number" id="inputDia" inputmode="numeric" placeholder="—" min="30" max="200">
      </label>
      <label class="field">
        <span>Pulso</span>
        <input type="number" id="inputPulse" inputmode="numeric" placeholder="—" min="30" max="220">
      </label>
    </div>

    <div class="datetime-row">
      <label class="field">
        <span>Fecha</span>
        <input type="date" id="inputDate">
      </label>
      <label class="field">
        <span>Hora</span>
        <input type="time" id="inputTime">
      </label>
    </div>

    <label class="field notes-field">
      <span>Notas (opcional)</span>
      <input type="text" id="inputNotes" placeholder="Ej. antes de comer, brazo izquierdo...">
    </label>

    <div id="catBanner" class="cat-banner hidden"></div>

    <button id="saveBtn" class="save-btn">Guardar registro</button>
  </section>
</main>


<nav class="tabbar">
  <button class="tab-btn active" data-view="view-log">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    <span>Bitácora</span>
  </button>
  <button class="tab-btn" data-view="view-add">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
    <span>Registrar</span>
  </button>
</nav>

<div id="toast" class="toast hidden"></div>

<script src="assets/lib/chart.umd.min.js"></script>
<script src="assets/lib/jspdf.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
